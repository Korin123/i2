# Azure DevOps pipeline. Thin - it runs the scripts in scripts/, which also run locally.
#
# Controlled deployment:
# - No automatic runs: pushes and pull requests start nothing.
# - Every run is manual ("Run pipeline"); Validate always runs, then only the stages you choose.
#   Pick components to redeploy just what you fixed, and use the preview options to see the
#   changes (Bicep what-if / kubectl diff) before applying them.
# - Images are built locally with ADT in the dev container (i2-recommended) and pushed with
#   scripts/30-build-images.sh, not here. Deploy stages check the images exist in ACR first.
#
# One-time setup per organisation (docs/how-to/set-up-azure-devops.md): set the defaults of the
# three "Setup" parameters below. Environment-specific names live in the variable group
# i2-<environment> (Pipelines > Library), including VNET_AGENT_POOL, the in-VNet agent pool.
# See docs/how-to/runbook.md for the order of runs.

trigger: none
pr: none

parameters:
  # --- Setup: change these defaults once for your organisation ---
  - name: environment
    displayName: 'Setup: environment (uses bicep/parameters/<environment>.bicepparam and variable group i2-<environment>)'
    type: string
    default: 'alpha'
  - name: serviceConnection
    displayName: 'Setup: Azure Resource Manager service connection'
    type: string
    default: 'DFN-ADO-CONN'
  - name: infraOnMicrosoftHosted
    displayName: 'Setup: run Validate and Infra on Microsoft-hosted agents (use for the first deployment, before the VNet exists)'
    type: boolean
    default: true
  # --- Run options ---
  - name: infra
    displayName: 'Infra (Bicep, incl. SQL MI)'
    type: string
    default: 'skip'
    values: [ 'skip', 'preview', 'deploy' ]
  - name: seedSecrets
    displayName: 'Secrets: seed missing secrets + certs into Key Vault'
    type: boolean
    default: false
  - name: reissueCerts
    displayName: 'Secrets: reissue these certs (space separated, e.g. "solr zookeeper")'
    type: string
    default: ' '
  - name: workload
    displayName: 'Workload (Kubernetes on AKS)'
    type: string
    default: 'skip'
    values: [ 'skip', 'preview', 'deploy' ]
  - name: components
    displayName: 'Workload: components (all, or any of: base zookeeper solr-init solr collections database connectors liberty match-rules ingress)'
    type: string
    default: 'all'
  - name: runSanity
    displayName: 'Verify: run sanity checks'
    type: boolean
    default: false

variables:
  # SUBSCRIPTION_ID, LOCATION, I2_VERSION, ADT_VERSION, VNET_AGENT_POOL, ... Resource names come from the deployment outputs.
  - group: i2-${{ parameters.environment }}
  - name: I2_ENV
    value: ${{ parameters.environment }}
  - name: isManual
    value: $[eq(variables['Build.Reason'], 'Manual')]

stages:
  - stage: Validate
    pool:
      ${{ if parameters.infraOnMicrosoftHosted }}:
        vmImage: ubuntu-latest
      ${{ else }}:
        name: $(VNET_AGENT_POOL)   # Managed DevOps Pool in the i2 VNet (variable group)
    jobs:
      - job: validate
        steps:
          - task: AzureCLI@2
            displayName: 'bicep build'
            inputs:
              azureSubscription: ${{ parameters.serviceConnection }}
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -e
                az bicep build --file bicep/main.bicep --stdout > /dev/null
                az bicep build-params --file "bicep/parameters/${I2_ENV}.bicepparam" --stdout > /dev/null
                echo "bicep + bicep/parameters/${I2_ENV}.bicepparam ok"
          - bash: |
              set -e
              for f in scripts/*.sh images/*/*.sh; do bash -n "$f"; done
              echo "shell syntax ok"
            displayName: 'script syntax'

  # Each deploy stage runs when it is chosen (not skip / ticked) and no earlier stage failed.
  # Stages not chosen are skipped and do not block later ones; a failed stage stops all later
  # ones (each stage depends on every earlier stage).
  - stage: DeployInfra
    dependsOn: Validate
    condition: and(succeeded(), eq(variables.isManual, true), ne('${{ parameters.infra }}', 'skip'))
    pool:
      ${{ if parameters.infraOnMicrosoftHosted }}:
        vmImage: ubuntu-latest
      ${{ else }}:
        name: $(VNET_AGENT_POOL)   # Managed DevOps Pool in the i2 VNet (variable group)
    jobs:
      - deployment: infra
        environment: i2-${{ parameters.environment }}   # approvals/checks configured on the environment
        # SQL MI first creation takes hours. Microsoft-hosted jobs stop at 360 min (60 on the free
        # tier); if that happens the deployment carries on in Azure and scripts/10 has already
        # stored the MI password, so just run Infra again once it has finished.
        timeoutInMinutes: 360
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                - task: AzureCLI@2
                  displayName: ${{ iif(eq(parameters.infra, 'deploy'), 'Deploy infra (incl. SQL MI)', 'Preview infra (what-if, no changes)') }}
                  inputs:
                    azureSubscription: ${{ parameters.serviceConnection }}
                    scriptType: bash
                    scriptLocation: inlineScript
                    addSpnToEnvironment: true
                    inlineScript: bash scripts/10-deploy-infra.sh
                  env:
                    WHAT_IF: ${{ ne(parameters.infra, 'deploy') }}

  - stage: SeedSecrets
    dependsOn: [ Validate, DeployInfra ]
    condition: and(not(failed()), not(canceled()), eq(variables.isManual, true), eq('${{ parameters.seedSecrets }}', 'true'))
    pool:
      name: $(VNET_AGENT_POOL)   # Managed DevOps Pool in the i2 VNet (variable group)
    jobs:
      - job: seed
        steps:
          - task: AzureCLI@2
            displayName: 'Seed PKI + secret set into Key Vault'
            inputs:
              azureSubscription: ${{ parameters.serviceConnection }}
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: bash scripts/20-seed-secrets-pki.sh
            env:
              REISSUE_CERTS: ${{ parameters.reissueCerts }}

  - stage: DeployWorkload
    dependsOn: [ Validate, DeployInfra, SeedSecrets ]
    condition: and(not(failed()), not(canceled()), eq(variables.isManual, true), ne('${{ parameters.workload }}', 'skip'))
    pool:
      name: $(VNET_AGENT_POOL)   # Managed DevOps Pool in the i2 VNet (variable group)
    jobs:
      - deployment: k8s
        environment: i2-${{ parameters.environment }}
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                - task: AzureCLI@2
                  displayName: '${{ iif(eq(parameters.workload, ''deploy''), ''Apply'', ''Preview (kubectl diff)'') }} manifests: ${{ parameters.components }}'
                  inputs:
                    azureSubscription: ${{ parameters.serviceConnection }}
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: bash scripts/40-deploy-workload.sh ${{ replace(parameters.components, ',', ' ') }}
                  env:
                    DRY_RUN: ${{ ne(parameters.workload, 'deploy') }}

  - stage: Sanity
    dependsOn: [ Validate, DeployInfra, SeedSecrets, DeployWorkload ]
    condition: and(not(failed()), not(canceled()), eq(variables.isManual, true), eq('${{ parameters.runSanity }}', 'true'))
    pool:
      name: $(VNET_AGENT_POOL)   # Managed DevOps Pool in the i2 VNet (variable group)
    jobs:
      - job: sanity
        steps:
          - task: AzureCLI@2
            displayName: 'Sanity checks'
            inputs:
              azureSubscription: ${{ parameters.serviceConnection }}
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: bash scripts/60-sanity.sh
