# Azure DevOps pipeline. Thin - it runs the scripts in scripts/, which also run
# locally and from any CI (a GitHub Actions workflow can call the same scripts).
# Runs on a self-hosted agent on the VNet for the private KV/ACR/AKS.
#
# Controlled deployment:
# - A push to main runs Validate only. Nothing is deployed automatically.
# - Deploy stages run only on a manual run ("Run pipeline"), and only the stages you tick.
#   Pick components to redeploy just what you fixed, and use the preview options to see
#   the changes (Bicep what-if / kubectl diff) before applying them.
# - Image build (scripts/30) is done locally with ADT in the dev container (i2-recommended),
#   not here. Deploy stages check the images they need exist in ACR first.
# See docs/how-to/deploy-with-the-pipeline.md.

trigger:
  branches:
    include:
      - main
  paths:
    include:
      - bicep/**
      - k8s/**
      - scripts/**
      - images/**
      - pipelines/**

parameters:
  - name: deployInfra
    displayName: 'Infra: deploy Bicep (incl. SQL MI)'
    type: boolean
    default: false
  - name: infraWhatIf
    displayName: 'Infra: preview only (what-if, no changes)'
    type: boolean
    default: true
  - name: seedSecrets
    displayName: 'Secrets: seed missing secrets + certs into Key Vault'
    type: boolean
    default: false
  - name: reissueCerts
    displayName: 'Secrets: reissue these certs (space separated, e.g. "solr zookeeper")'
    type: string
    default: ' '
  - name: deployWorkload
    displayName: 'Workload: deploy to AKS'
    type: boolean
    default: true
  - name: components
    displayName: 'Workload: components (all, or any of: base zookeeper solr-init solr collections database connectors liberty match-rules ingress)'
    type: string
    default: 'all'
  - name: workloadDryRun
    displayName: 'Workload: preview only (kubectl diff, no changes)'
    type: boolean
    default: false
  - name: runSanity
    displayName: 'Verify: run sanity checks'
    type: boolean
    default: true

variables:
  - group: i2-alpha                 # SUBSCRIPTION_ID, TENANT_ID, RG, KV, ACR, AKS, MI_FQDN, ...
  - name: serviceConnection
    value: 'DFN-ADO-CONN'
  - name: isManual
    value: $[eq(variables['Build.Reason'], 'Manual')]

pool:
  name: 'alpha-vnet'               # self-hosted, on-network

stages:
  - stage: Validate
    jobs:
      - job: validate
        steps:
          - task: AzureCLI@2
            displayName: 'bicep build'
            inputs:
              azureSubscription: $(serviceConnection)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                az bicep restore --file bicep/main.bicep
                az bicep build --file bicep/main.bicep
          - bash: |
              set -e
              for f in scripts/*.sh images/*/*.sh; do bash -n "$f"; done
              echo "shell syntax ok"
            displayName: 'script syntax'

  # Each deploy stage runs when: manual run + its box ticked + no earlier stage failed.
  # Unticked stages are skipped and do not block later ones; a failed stage stops all later
  # ones (each stage depends on every earlier stage).
  - stage: DeployInfra
    dependsOn: Validate
    condition: and(succeeded(), eq(variables.isManual, true), eq('${{ parameters.deployInfra }}', 'true'))
    jobs:
      - deployment: infra
        environment: i2-alpha           # approvals/checks configured on the environment
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                - task: AzureCLI@2
                  displayName: ${{ iif(parameters.infraWhatIf, 'What-if infra (no changes)', 'Deploy infra (incl. SQL MI)') }}
                  inputs:
                    azureSubscription: $(serviceConnection)
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: bash scripts/10-deploy-infra.sh
                  env:
                    WHAT_IF: ${{ parameters.infraWhatIf }}

  - stage: SeedSecrets
    dependsOn: [ Validate, DeployInfra ]
    condition: and(not(failed()), not(canceled()), eq(variables.isManual, true), eq('${{ parameters.seedSecrets }}', 'true'))
    jobs:
      - job: seed
        steps:
          - task: AzureCLI@2
            displayName: 'Seed PKI + secret set into Key Vault'
            inputs:
              azureSubscription: $(serviceConnection)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: bash scripts/20-seed-secrets-pki.sh
            env:
              REISSUE_CERTS: ${{ parameters.reissueCerts }}

  - stage: DeployWorkload
    dependsOn: [ Validate, DeployInfra, SeedSecrets ]
    condition: and(not(failed()), not(canceled()), eq(variables.isManual, true), eq('${{ parameters.deployWorkload }}', 'true'))
    jobs:
      - deployment: k8s
        environment: i2-alpha
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                - task: AzureCLI@2
                  displayName: '${{ iif(parameters.workloadDryRun, ''Diff'', ''Apply'') }} manifests: ${{ parameters.components }}'
                  inputs:
                    azureSubscription: $(serviceConnection)
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: bash scripts/40-deploy-workload.sh ${{ replace(parameters.components, ',', ' ') }}
                  env:
                    DRY_RUN: ${{ parameters.workloadDryRun }}

  - stage: Sanity
    dependsOn: [ Validate, DeployInfra, SeedSecrets, DeployWorkload ]
    condition: and(not(failed()), not(canceled()), eq(variables.isManual, true), eq('${{ parameters.runSanity }}', 'true'))
    jobs:
      - job: sanity
        steps:
          - task: AzureCLI@2
            displayName: 'Sanity checks'
            inputs:
              azureSubscription: $(serviceConnection)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: bash scripts/60-sanity.sh
