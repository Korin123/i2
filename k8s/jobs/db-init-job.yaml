# i2-db-init - creates and initialises the Information Store on the SQL Managed Instance,
# mirroring ADT 3.2.2 initialize_istore_database_for_sql_server + configure_istore_database:
# database, dba login/user, roles + grants, dbb/i2analyze/i2etl/etl logins, etl sysadmin,
# static then dynamic scripts, extra roles. Image: images/db-init (ADT sqlserver_client_redhat
# + scripts generated by `deploy -t generate-db-scripts`). Resumable and safe to re-run.
apiVersion: batch/v1
kind: Job
metadata: { name: i2-db-init, namespace: i2analyze }
spec:
  backoffLimit: 2
  template:
    metadata: { labels: { app: i2-db-init, azure.workload.identity/use: "true" } }
    spec:
      restartPolicy: Never
      serviceAccountName: i2-bootstrap
      nodeSelector: { workload: i2-analyze }
      containers:
        - name: db-init
          image: __ACR__/i2group/i2-db-init:__I2_VERSION__
          args: [ "/opt/db-init.sh" ]
          env:
            - { name: DB_SERVER, value: "__MI_FQDN__" }
            - { name: DB_PORT, value: "1433" }
            - { name: DB_NAME, value: "ISTORE" }
            - { name: SA_USERNAME, value: "i2miadmin" }               # MI admin login (bicep sql-mi adminLogin)
            - { name: SSL_CA_CERTIFICATE_FILE, value: /etc/i2secrets/CA.cer }
          volumeMounts:
            - { name: secrets, mountPath: /etc/i2secrets, readOnly: true }
      volumes:
        - name: secrets
          csi: { driver: secrets-store.csi.k8s.io, readOnly: true, volumeAttributes: { secretProviderClass: i2-bootstrap-secrets } }
