# i2-solr-collections - SolrCloud initialisation. After Solr is ready: creates the 8 i2 Analyze collections (ADT create_solr_collections).
# numShards=1, replicationFactor=2 with the affinity placement plugin, as ADT pre-prod.
# Image: images/solr-init (ADT solr_client_redhat + generated configsets). Idempotent.
apiVersion: batch/v1
kind: Job
metadata: { name: i2-solr-collections, namespace: i2analyze }
spec:
  backoffLimit: 4
  template:
    metadata: { labels: { app: i2-solr-collections, azure.workload.identity/use: "true" } }
    spec:
      restartPolicy: Never
      serviceAccountName: i2-bootstrap
      nodeSelector: { workload: i2-analyze }
      containers:
        - name: solr-init
          image: __ACR__/i2group/i2-solr-init:__I2_VERSION__
          args: [ "/opt/solr-init.sh", "collections" ]
          env:
            - { name: ZK_MEMBERS, value: "zookeeper-0.zookeeper-headless:2281,zookeeper-1.zookeeper-headless:2281,zookeeper-2.zookeeper-headless:2281" }
            - { name: SOLR_CLUSTER_ID, value: "is_cluster" }
            - { name: SOLR_BASE_URL, value: "https://solr-0.solr-headless.i2analyze.svc.cluster.local:8983" }
            - { name: NUM_SHARDS, value: "1" }
            - { name: REPLICATION_FACTOR, value: "2" }
            - { name: SOLR_ZOO_SSL_CONNECTION, value: "true" }
            - { name: SSL_PRIVATE_KEY_FILE, value: /etc/i2secrets/server.key }
            - { name: SSL_CERTIFICATE_FILE, value: /etc/i2secrets/server.cer }
            - { name: SSL_CA_CERTIFICATE_FILE, value: /etc/i2secrets/CA.cer }
            - { name: SOLR_ADMIN_DIGEST_USERNAME, value: "solr" }
            - name: SOLR_ADMIN_DIGEST_PASSWORD
              valueFrom: { secretKeyRef: { name: i2-solr-client-credentials, key: SOLR_ADMIN_DIGEST_PASSWORD } }
            - { name: ZOO_DIGEST_USERNAME, value: "solr" }
            - name: ZOO_DIGEST_PASSWORD
              valueFrom: { secretKeyRef: { name: i2-solr-client-credentials, key: ZOO_DIGEST_PASSWORD } }
            - { name: ZOO_DIGEST_READONLY_USERNAME, value: "readonly-user" }
            - name: ZOO_DIGEST_READONLY_PASSWORD
              valueFrom: { secretKeyRef: { name: i2-solr-client-credentials, key: ZOO_DIGEST_READONLY_PASSWORD } }
          volumeMounts:
            - { name: secrets, mountPath: /etc/i2secrets, readOnly: true }
      volumes:
        - name: secrets
          csi: { driver: secrets-store.csi.k8s.io, readOnly: true, volumeAttributes: { secretProviderClass: i2-solr-client-secrets } }
