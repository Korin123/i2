# Projects the i2 secret + PKI set from Key Vault into pods as files, via the
# Key Vault CSI driver (auth = workload-identity UAMI, Key Vault Secrets User).
# Mounted at /etc/i2secrets (NOT /run/secrets - a read-only mount there blocks
# the k8s service-account token). KV secret names cannot contain dots, so PEM
# material is stored hyphenated and aliased to the file names the images expect.
# The Solr server/client images take certs as *_FILE but ZooKeeper digest and Solr
# credentials only as plain env (ADT images-and-containers/solr), so those are also
# synced to a k8s Secret (secretObjects) for secretKeyRef. A synced Secret exists
# only while a pod mounts its SecretProviderClass.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: i2-liberty-secrets
  namespace: i2analyze
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: "__WI_CLIENT_ID__"
    keyvaultName: "__KV_NAME__"
    tenantId: "__TENANT_ID__"
    objects: |
      array:
        - |
          objectName: liberty-cert
          objectType: secret
          objectAlias: server.cer
        - |
          objectName: liberty-key
          objectType: secret
          objectAlias: server.key
        - |
          objectName: i2-ca-cert
          objectType: secret
          objectAlias: CA.cer
        - |
          objectName: jwt-cert
          objectType: secret
          objectAlias: jwt.cer
        - |
          objectName: jwt-key
          objectType: secret
          objectAlias: jwt.key
        - |
          objectName: gateway-cert
          objectType: secret
          objectAlias: gateway.cer
        - |
          objectName: gateway-key
          objectType: secret
          objectAlias: gateway.key
        - |
          objectName: db-i2analyze-password
          objectType: secret
          objectAlias: DB_PASSWORD
        - |
          objectName: solr-application-digest-password
          objectType: secret
          objectAlias: SOLR_HTTP_BASIC_AUTH_PASSWORD
        - |
          objectName: zk-digest-password
          objectType: secret
          objectAlias: ZOO_DIGEST_PASSWORD
        - |
          objectName: liberty-admin-password
          objectType: secret
          objectAlias: ADT_ADMIN_PASSWORD
  secretObjects: []
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: i2-solr-secrets
  namespace: i2analyze
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: "__WI_CLIENT_ID__"
    keyvaultName: "__KV_NAME__"
    tenantId: "__TENANT_ID__"
    objects: |
      array:
        - |
          objectName: solr-cert
          objectType: secret
          objectAlias: server.cer
        - |
          objectName: solr-key
          objectType: secret
          objectAlias: server.key
        - |
          objectName: i2-ca-cert
          objectType: secret
          objectAlias: CA.cer
        - |
          objectName: zk-digest-password
          objectType: secret
          objectAlias: ZOO_DIGEST_PASSWORD
        - |
          objectName: zk-digest-readonly-password
          objectType: secret
          objectAlias: ZOO_DIGEST_READONLY_PASSWORD
  secretObjects:
    - secretName: i2-solr-credentials
      type: Opaque
      data:
        - { objectName: ZOO_DIGEST_PASSWORD, key: ZOO_DIGEST_PASSWORD }
        - { objectName: ZOO_DIGEST_READONLY_PASSWORD, key: ZOO_DIGEST_READONLY_PASSWORD }
---
# Solr client Jobs (solr-zk-init, solr-collections): ADT's run_solr_client_command contract.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: i2-solr-client-secrets
  namespace: i2analyze
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: "__WI_CLIENT_ID__"
    keyvaultName: "__KV_NAME__"
    tenantId: "__TENANT_ID__"
    objects: |
      array:
        - |
          objectName: solr-client-cert
          objectType: secret
          objectAlias: server.cer
        - |
          objectName: solr-client-key
          objectType: secret
          objectAlias: server.key
        - |
          objectName: i2-ca-cert
          objectType: secret
          objectAlias: CA.cer
        - |
          objectName: solr-admin-digest-password
          objectType: secret
          objectAlias: SOLR_ADMIN_DIGEST_PASSWORD
        - |
          objectName: zk-digest-password
          objectType: secret
          objectAlias: ZOO_DIGEST_PASSWORD
        - |
          objectName: zk-digest-readonly-password
          objectType: secret
          objectAlias: ZOO_DIGEST_READONLY_PASSWORD
        - |
          objectName: solr-security-json
          objectType: secret
          objectAlias: security.json
  secretObjects:
    - secretName: i2-solr-client-credentials
      type: Opaque
      data:
        - { objectName: SOLR_ADMIN_DIGEST_PASSWORD, key: SOLR_ADMIN_DIGEST_PASSWORD }
        - { objectName: ZOO_DIGEST_PASSWORD, key: ZOO_DIGEST_PASSWORD }
        - { objectName: ZOO_DIGEST_READONLY_PASSWORD, key: ZOO_DIGEST_READONLY_PASSWORD }
---
