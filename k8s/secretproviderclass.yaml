# Projects the i2 secret + PKI set from Key Vault into pods as files, via the
# Key Vault CSI driver (auth = workload-identity UAMI, Key Vault Secrets User).
# Mounted at /etc/i2secrets (NOT /run/secrets - a read-only mount there blocks
# the k8s service-account token). KV secret names cannot contain dots, so PEM
# material is stored hyphenated and aliased to the file names the images expect.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: i2-liberty-secrets
  namespace: i2analyze
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: "__WI_CLIENT_ID__"
    keyvaultName: "__KV_NAME__"
    tenantId: "__TENANT_ID__"
    objects: |
      array:
        - |
          objectName: liberty-cert
          objectType: secret
          objectAlias: server.cer
        - |
          objectName: liberty-key
          objectType: secret
          objectAlias: server.key
        - |
          objectName: i2-ca-cert
          objectType: secret
          objectAlias: CA.cer
        - |
          objectName: jwt-cert
          objectType: secret
          objectAlias: jwt.cer
        - |
          objectName: jwt-key
          objectType: secret
          objectAlias: jwt.key
        - |
          objectName: gateway-cert
          objectType: secret
          objectAlias: gateway.cer
        - |
          objectName: gateway-key
          objectType: secret
          objectAlias: gateway.key
        - |
          objectName: db-i2analyze-password
          objectType: secret
          objectAlias: DB_PASSWORD
        - |
          objectName: solr-auth-password
          objectType: secret
          objectAlias: SOLR_HTTP_BASIC_AUTH_PASSWORD
        - |
          objectName: solr-auth-password
          objectType: secret
          objectAlias: ZOO_DIGEST_PASSWORD
        - |
          objectName: liberty-admin-password
          objectType: secret
          objectAlias: ADT_ADMIN_PASSWORD
  secretObjects: []
---
