<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="1020" viewBox="0 0 1360 1020" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1360" height="1020" fill="#0d1117"/>

  <!-- Title -->
  <text x="40" y="40" font-size="13" font-weight="700" letter-spacing="2" fill="#e3b341">i2 ANALYZE · AZURE TARGET ARCHITECTURE</text>
  <text x="40" y="72" font-size="26" font-weight="700" fill="#ffffff">AKS-hosted containers, SQL Managed Instance data tier</text>
  <text x="40" y="97" font-size="13" fill="#9da7b3">Liberty, Solr and ZooKeeper run as containers on AKS. The database is Azure SQL Managed Instance (managed, off containers). Brownfield: the VNet is imported, never created.</text>

  <!-- ===================== CURRENT STATE band ===================== -->
  <g>
    <rect x="40" y="120" width="1280" height="132" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="56" y="144" font-size="12" font-weight="700" letter-spacing="1" fill="#8b949e">CURRENT STATE  ·  VMs configured by Ansible</text>
    <!-- 5 VMs -->
    <g font-size="11" fill="#c9d1d9">
      <rect x="60" y="158" width="150" height="72" rx="6" fill="#21262d" stroke="#3d444d"/><text x="135" y="188" text-anchor="middle" fill="#e6edf3" font-weight="700">i2 Analyze</text><text x="135" y="206" text-anchor="middle">Liberty · VM</text>
      <rect x="220" y="158" width="150" height="72" rx="6" fill="#21262d" stroke="#3d444d"/><text x="295" y="188" text-anchor="middle" fill="#e6edf3" font-weight="700">Connectors</text><text x="295" y="206" text-anchor="middle">i2 Connect · VM</text>
      <rect x="380" y="158" width="150" height="72" rx="6" fill="#21262d" stroke="#3d444d"/><text x="455" y="188" text-anchor="middle" fill="#e6edf3" font-weight="700">Solr</text><text x="455" y="206" text-anchor="middle">Search · VM</text>
      <rect x="540" y="158" width="150" height="72" rx="6" fill="#21262d" stroke="#3d444d"/><text x="615" y="188" text-anchor="middle" fill="#e6edf3" font-weight="700">ZooKeeper</text><text x="615" y="206" text-anchor="middle">Coordination · VM</text>
      <rect x="700" y="158" width="150" height="72" rx="6" fill="#21262d" stroke="#3d444d"/><text x="775" y="188" text-anchor="middle" fill="#e6edf3" font-weight="700">Database</text><text x="775" y="206" text-anchor="middle">SQL Server · VM</text>
    </g>
    <text x="880" y="180" font-size="11" fill="#8b949e">Manual VM provisioning · no containers ·</text>
    <text x="880" y="198" font-size="11" fill="#8b949e">no auto-scaling · single points of failure ·</text>
    <text x="880" y="216" font-size="11" fill="#8b949e">SSH/RDP administration.</text>
  </g>

  <!-- arrow down -->
  <text x="700" y="276" font-size="12" fill="#e3b341" text-anchor="middle" font-weight="700">▼  migrate to Azure</text>

  <!-- ===================== AZURE TARGET ===================== -->
  <rect x="40" y="290" width="1280" height="600" rx="10" fill="#0f1620" stroke="#1f6feb" stroke-width="1.5"/>
  <text x="58" y="316" font-size="13" font-weight="700" fill="#58a6ff">Azure subscription  ·  uksouth  ·  resource group rg-i2-alpha-001</text>

  <!-- VNet -->
  <rect x="58" y="330" width="900" height="544" rx="8" fill="#0d1b2a" stroke="#2f6fed" stroke-dasharray="5 4"/>
  <text x="74" y="352" font-size="12" font-weight="700" fill="#79c0ff">Existing VNet (imported)  ·  i2 /24  ·  private subnets, public access disabled</text>

  <!-- AKS cluster -->
  <rect x="74" y="366" width="868" height="336" rx="8" fill="#10251c" stroke="#2ea043" stroke-width="1.4"/>
  <text x="90" y="388" font-size="12" font-weight="700" fill="#3fb950">AKS private cluster  aks-i2-alpha-001   ·   Cilium overlay · Entra + Azure RBAC · workload identity</text>
  <text x="90" y="406" font-size="10.5" fill="#7ee2a8">namespace i2analyze · dedicated i2stateful node pool · zones 1-3 · CONTAINERS</text>

  <!-- ingress -->
  <rect x="92" y="420" width="180" height="56" rx="6" fill="#132e22" stroke="#2ea043"/>
  <text x="182" y="443" font-size="11.5" font-weight="700" fill="#7ee2a8" text-anchor="middle">Internal ingress</text>
  <text x="182" y="461" font-size="10" fill="#9be6b8" text-anchor="middle">App Gateway / NGINX</text>

  <!-- liberty -->
  <rect x="92" y="492" width="400" height="86" rx="6" fill="#0f1f18" stroke="#2ea043"/>
  <text x="292" y="514" font-size="11.5" font-weight="700" fill="#7ee2a8" text-anchor="middle">Liberty  x2  ·  i2 Analyze app (configured image)</text>
  <rect x="108" y="524" width="170" height="44" rx="4" fill="#16342650" stroke="#2ea04380"/><text x="193" y="551" font-size="10.5" fill="#c9f5d8" text-anchor="middle">liberty pod  (:9443 /opal)</text>
  <rect x="300" y="524" width="176" height="44" rx="4" fill="#16342650" stroke="#2ea04380"/><text x="388" y="545" font-size="10.5" fill="#c9f5d8" text-anchor="middle">i2 Connect connectors</text><text x="388" y="560" font-size="9" fill="#9be6b8" text-anchor="middle">Deployments · mTLS :3700</text>

  <!-- solr (highlighted) -->
  <rect x="92" y="592" width="400" height="94" rx="6" fill="#12271c" stroke="#e3b341" stroke-width="1.6"/>
  <text x="292" y="614" font-size="11.5" font-weight="700" fill="#f2cc60" text-anchor="middle">SolrCloud  x2  ·  ON CONTAINERS (StatefulSet)</text>
  <rect x="108" y="624" width="170" height="34" rx="4" fill="#1c352550" stroke="#2ea04380"/><text x="193" y="646" font-size="10.5" fill="#c9f5d8" text-anchor="middle">solr pod  (:8983 TLS)</text>
  <rect x="300" y="624" width="176" height="34" rx="4" fill="#1c352550" stroke="#2ea04380"/><text x="388" y="646" font-size="10.5" fill="#c9f5d8" text-anchor="middle">solr pod  · 8 collections</text>
  <text x="292" y="676" font-size="9.5" fill="#f2cc60" text-anchor="middle">Premium disks · dedicated pool · pushed onto AKS, not VMs</text>

  <!-- zookeeper -->
  <rect x="512" y="492" width="410" height="86" rx="6" fill="#0f1f18" stroke="#2ea043"/>
  <text x="717" y="514" font-size="11.5" font-weight="700" fill="#7ee2a8" text-anchor="middle">ZooKeeper ensemble  x3  ·  containers (i2 agreed)</text>
  <rect x="528" y="524" width="120" height="44" rx="4" fill="#16342650" stroke="#2ea04380"/><text x="588" y="551" font-size="10.5" fill="#c9f5d8" text-anchor="middle">zk-0</text>
  <rect x="655" y="524" width="120" height="44" rx="4" fill="#16342650" stroke="#2ea04380"/><text x="715" y="551" font-size="10.5" fill="#c9f5d8" text-anchor="middle">zk-1</text>
  <rect x="782" y="524" width="124" height="44" rx="4" fill="#16342650" stroke="#2ea04380"/><text x="844" y="551" font-size="10.5" fill="#c9f5d8" text-anchor="middle">zk-2</text>
  <text x="717" y="590" font-size="9.5" fill="#9be6b8" text-anchor="middle">secure client :2281 · digest auth · quorum survives one zone</text>

  <!-- data-plane arrows liberty->solr/zk -->
  <line x1="492" y1="540" x2="512" y2="540" stroke="#58a6ff" stroke-width="1.4"/>
  <line x1="292" y1="592" x2="292" y2="578" stroke="#58a6ff" stroke-width="1.4"/>

  <!-- PEP + SQL MI subnets -->
  <rect x="512" y="600" width="410" height="42" rx="6" fill="#0d1b2a" stroke="#2f6fed" stroke-dasharray="4 3"/>
  <text x="717" y="626" font-size="10.5" fill="#79c0ff" text-anchor="middle">snet-i2-pep · private endpoints: ACR · Key Vault · Storage · SQL MI</text>

  <rect x="512" y="650" width="410" height="44" rx="6" fill="#241a2e" stroke="#a371f7"/>
  <text x="717" y="669" font-size="11" font-weight="700" fill="#d2a8ff" text-anchor="middle">snet-i2-sqlmi (delegated)</text>
  <text x="717" y="686" font-size="10" fill="#c9b6ea" text-anchor="middle">Azure SQL Managed Instance · Information Store · off containers</text>

  <!-- data plane liberty -> MI (clean routed connector) -->
  <path d="M492 550 L505 550 L505 672 L512 672" fill="none" stroke="#58a6ff" stroke-width="1.4"/>
  <text x="110" y="760" font-size="11" fill="#79c0ff" font-weight="700">Liberty → SQL MI: JDBC 1433 TLS · DB_DIALECT=sqlserver</text>
  <text x="110" y="778" font-size="10" fill="#8b949e">db_init and Liberty use the MSSQL path; MI has SQL Agent for Information Store jobs.</text>

  <!-- ===================== Managed services column ===================== -->
  <rect x="972" y="330" width="348" height="250" rx="8" fill="#231a05" stroke="#e3b341" stroke-width="1.3"/>
  <text x="988" y="352" font-size="12" font-weight="700" fill="#f2cc60">Managed Azure services</text>
  <text x="988" y="378" font-size="11" fill="#e6d3a3">ACR  cri2alpha001xxx  ·  private</text>
  <text x="988" y="396" font-size="9.5" fill="#b3a06a">builds configured Liberty via the ADT client image</text>
  <text x="988" y="420" font-size="11" fill="#e6d3a3">Key Vault  kv-i2-alpha-001-xxx</text>
  <text x="988" y="438" font-size="9.5" fill="#b3a06a">ADT secret set + PKI (CA, per-service certs)</text>
  <text x="988" y="462" font-size="11" fill="#e6d3a3">Azure Monitor</text>
  <text x="988" y="480" font-size="9.5" fill="#b3a06a">Log Analytics · managed Prometheus + Grafana</text>
  <text x="988" y="504" font-size="11" fill="#e6d3a3">Blob storage  sti2distalpha001xxx</text>
  <text x="988" y="522" font-size="9.5" fill="#b3a06a">distribution + shared config artefacts</text>
  <text x="988" y="548" font-size="11" fill="#e6d3a3">Entra ID + managed identity</text>
  <text x="988" y="566" font-size="9.5" fill="#b3a06a">workload identity · Azure RBAC · no secrets in manifests</text>

  <!-- Delivery -->
  <rect x="972" y="592" width="348" height="140" rx="8" fill="#1a1430" stroke="#a371f7" stroke-width="1.3"/>
  <text x="988" y="614" font-size="12" font-weight="700" fill="#d2a8ff">Delivery (Infra + Config as Code)</text>
  <text x="988" y="638" font-size="10.5" fill="#cdbdf0">Bicep monorepo (i2/) · Azure DevOps pipeline</text>
  <text x="988" y="656" font-size="10.5" fill="#cdbdf0">self-hosted agent on the VNet</text>
  <text x="988" y="680" font-size="10.5" fill="#cdbdf0">az acr build · kubectl apply</text>
  <text x="988" y="698" font-size="10.5" fill="#cdbdf0">k8s Jobs: db_init (ISTORE) · solr_collections (8)</text>
  <text x="988" y="716" font-size="9.5" fill="#9b86c9">replaces i2's CDK + Ansible controller</text>

  <!-- Analyst access -->
  <rect x="972" y="744" width="348" height="60" rx="8" fill="#0d1b2a" stroke="#2f6fed"/>
  <text x="988" y="766" font-size="12" font-weight="700" fill="#79c0ff">Analyst access</text>
  <text x="988" y="788" font-size="10.5" fill="#a9c9f5">AVD estate → internal ingress · never internet-facing</text>

  <!-- control-plane dashed from delivery into cluster -->
  <path d="M972 660 L470 660 L470 500 L492 500" fill="none" stroke="#a371f7" stroke-width="1.2" stroke-dasharray="5 4"/>

  <!-- ===================== Legend ===================== -->
  <g font-size="11">
    <rect x="40" y="912" width="1280" height="86" rx="8" fill="#161b22" stroke="#30363d"/>
    <rect x="60" y="930" width="16" height="12" fill="#132e22" stroke="#2ea043"/><text x="84" y="940" fill="#c9d1d9">Container on AKS</text>
    <rect x="230" y="930" width="16" height="12" fill="#241a2e" stroke="#a371f7"/><text x="254" y="940" fill="#c9d1d9">Managed data tier (SQL MI)</text>
    <rect x="470" y="930" width="16" height="12" fill="#231a05" stroke="#e3b341"/><text x="494" y="940" fill="#c9d1d9">Managed Azure service</text>
    <line x1="700" y1="936" x2="740" y2="936" stroke="#58a6ff" stroke-width="2"/><text x="748" y="940" fill="#c9d1d9">Data plane (TLS)</text>
    <line x1="900" y1="936" x2="940" y2="936" stroke="#a371f7" stroke-width="2" stroke-dasharray="5 4"/><text x="948" y="940" fill="#c9d1d9">Deploy / control plane</text>
    <rect x="1110" y="930" width="16" height="12" fill="#12271c" stroke="#e3b341" stroke-width="1.6"/><text x="1134" y="940" fill="#c9d1d9">Solr: pushed onto containers</text>
    <text x="60" y="970" font-size="10.5" fill="#8b949e">Same app contract as i2's AWS reference: Liberty /opal 9443, Solr TLS 8983, ZK 2281 digest, TLS end to end, offline-first.</text>
    <text x="60" y="987" font-size="10.5" fill="#8b949e">Differences from the AWS reference: AKS instead of ECS/EC2; SQL Managed Instance instead of RDS PostgreSQL; Solr on containers instead of dedicated VMs.</text>
  </g>
</svg>
